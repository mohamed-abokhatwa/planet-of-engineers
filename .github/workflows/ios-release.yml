# Builds the iPhone/iPad app on Expo (EAS) and sends it to App Store Connect (TestFlight), from GitHub.
# Run it from the Actions tab ("iOS release" → Run workflow).
# Secrets (Settings → Secrets and variables → Actions), entered by the owner — never in chat:
#   EXPO_TOKEN          Expo access token (expo.dev → Account settings → Access tokens)
#   APPLE_API_KEY       App Store Connect API key ID (role: Admin)
#   APPLE_API_ISSUER    App Store Connect issuer ID
#   APPLE_API_KEY_P8    the whole text of the .p8 key file
#   APPLE_TEAM_ID       Apple Developer team ID (developer.apple.com → Membership)
name: iOS release

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: App Store Connect key
        run: printf '%s' "${{ secrets.APPLE_API_KEY_P8 }}" > "$RUNNER_TEMP/asc.p8"
      - name: Build (EAS creates the certificate and profile with the API key) and send to App Store Connect
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc.p8
          EXPO_ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          npx -y eas-cli@latest build --platform ios --profile production --non-interactive --wait
          npx -y eas-cli@latest submit --platform ios --latest --non-interactive
