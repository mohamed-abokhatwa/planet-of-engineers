# Supabase pauses free projects after a week without requests. This pings the
# public REST endpoint twice a week so the app's database stays awake.
name: Keep database awake
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(jq -r '.expo.extra.supabaseUrl // ""' app.json)
          KEY=$(jq -r '.expo.extra.supabaseAnonKey // ""' app.json)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Database not configured yet"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/questions?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          [ "$code" -lt 500 ]
